name: linkcheck

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: scripts/fetch_tutorials.sh
      - name: Check links
        id: check
        run: sphinx-build -b linkcheck -D nb_execution_mode=off docs _build/linkcheck
      - name: Report broken links
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(grep -E '\[broken\]' _build/linkcheck/output.txt || true)"
          body="Weekly link check failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"$'\n\n```\n'"$body"$'\n```'
          existing="$(gh issue list --label broken-links --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Broken links on the site" --label broken-links --body "$body"
          fi
